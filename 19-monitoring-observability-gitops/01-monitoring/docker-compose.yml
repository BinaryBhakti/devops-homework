# Session 20 monitoring + observability stack. Extends the course's 03-prometheus / 04-grafana
# compose files from "Prometheus scraping itself" to all three pillars around one real app.
name: session20

services:
  app:                       # the thing being observed
    build: ./app
    image: session20-orders-api:1.0.0
    environment: { APP_VERSION: "1.0.0" }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 10s                 # starting a Python interpreter took >3 s on the loaded host
      retries: 3

  loadgen:                   # steady synthetic traffic
    image: busybox:1.36
    volumes: ["./app/loadgen.sh:/loadgen.sh:ro"]
    command: ["/loadgen.sh"]
    depends_on: [app]

  prometheus:                # METRICS: scrape + store + evaluate alert rules
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]

  alertmanager:              # ALERTS: routing, grouping, silencing
    image: prom/alertmanager:v0.28.1
    ports: ["9093:9093"]
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]

  alert-receiver:            # stands in for Slack/PagerDuty: logs every webhook it receives
    image: python:3.12-alpine
    command: ["python", "-u", "-c", "import http.server,json\nclass H(http.server.BaseHTTPRequestHandler):\n def do_POST(s):\n  b=json.loads(s.rfile.read(int(s.headers['Content-Length'])))\n  [print('ALERT', a['status'].upper(), a['labels'].get('alertname'), a['labels'].get('severity'), '-', a['annotations'].get('summary')) for a in b['alerts']]\n  s.send_response(200); s.end_headers()\n def log_message(s,*a): pass\nhttp.server.HTTPServer(('',5001),H).serve_forever()"]

  node-exporter:             # host (Docker VM) CPU / memory / disk
    image: prom/node-exporter:v1.9.1
    pid: host
    volumes: ["/proc:/host/proc:ro", "/sys:/host/sys:ro"]
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys"]

  loki:                      # LOGS: store + LogQL
    image: grafana/loki:3.5.3
    ports: ["3100:3100"]
    command: ["-config.file=/etc/loki/local-config.yaml"]

  alloy:                     # LOGS: collects every container's stdout via the Docker API
    image: grafana/alloy:v1.10.2
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: ["run", "/etc/alloy/config.alloy"]
    depends_on: [loki]

  jaeger:                    # TRACES: OTLP receiver + UI
    image: jaegertracing/all-in-one:1.73.0
    ports: ["16686:16686"]

  grafana:                   # one UI over all three
    image: grafana/grafana:12.1.1
    ports: ["3300:3000"]          # 3000 is taken on this Mac by another dev server
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki, jaeger]
