# Registers the repository with Argo CD and asks for SHALLOW clones (depth 1).
# The homework repository is ~70 MB (screenshots); over this ~0.5 MB/s link a full clone took
# longer than Argo CD's timeouts and the connection was dropped mid-transfer. Combined with the
# small gitops-config branch, depth 1 means each fetch is a few KB.
# Public repository: no credentials needed. For a private one, add username/password (a token).
apiVersion: v1
kind: Secret
metadata:
  name: repo-devops-homework
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/BinaryBhakti/devops-homework.git
  depth: "1"
