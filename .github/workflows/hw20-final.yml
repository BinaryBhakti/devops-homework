# Homework 20 (Session 21) — IncidentDesk final project: CI/CD + DevSecOps + GitOps.
#
#   build-test ─┬─ sast ─────────┐
#               ├─ sca ──────────┤
#               ├─ secret-scan ──┼─ security-gate ─ push (GHCR) ─ deploy (kind) ─ gitops (bump tag in Git)
#               └─ docker-build ─ image-scan ┘
#
# Lives at the repo root because GitHub only runs workflows from /.github/workflows; it is
# path-filtered to the project so other homeworks don't trigger it.
name: HW20 Final — IncidentDesk

on:
  push:
    branches: [main]
    paths:
      - "20-final-devops-project/**"
      - ".github/workflows/hw20-final.yml"
  pull_request:
    branches: [main]
    paths:
      - "20-final-devops-project/**"
      - ".github/workflows/hw20-final.yml"
  workflow_dispatch:

concurrency:
  group: hw20-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel a main run mid-gitops

permissions:
  contents: read

env:
  PROJECT: 20-final-devops-project
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/binarybhakti/incidentdesk-backend
  FRONTEND_IMAGE: ghcr.io/binarybhakti/incidentdesk-frontend
  TRIVY_IMAGE: aquasec/trivy:0.75.0
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  SEMGREP_IMAGE: semgrep/semgrep:latest

defaults:
  run:
    working-directory: 20-final-devops-project

# Rule used throughout: no ${{ }} expression is pasted into a `run:` script. Values reach the
# shell through `env:`, so a multi-line output or an attacker-influenced string can never
# change the script's syntax (a multi-line output did exactly that in hw15-cicd.yml).

jobs:
  # ------------------------------------------------------------------ BUILD & TEST
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      postgres:                       # a real, throwaway test database — not a mock, not SQLite
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: incidentdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d incidentdesk_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v7
      - id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 20-final-devops-project/application/backend/requirements-dev.txt
      - name: Install backend dependencies
        working-directory: 20-final-devops-project/application/backend
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: 20-final-devops-project/application/backend
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: Unit + API tests (pytest, coverage gate 85%)
        working-directory: 20-final-devops-project/application/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/incidentdesk_test
        run: |
          mkdir -p reports
          pytest -v --junitxml=reports/junit.xml --cov=app --cov-report=term-missing \
                 --cov-report=xml:reports/coverage.xml --cov-fail-under=85
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 20-final-devops-project/application/frontend/package-lock.json
      - name: Build frontend
        working-directory: 20-final-devops-project/application/frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Test summary
        if: always()
        working-directory: 20-final-devops-project/application/backend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse("reports/junit.xml").getroot()
          s = s if s.tag == "testsuite" else s[0]
          print("### Backend tests\n| tests | failures | errors | time |\n|---|---|---|---|")
          print(f"| {s.get('tests')} | {s.get('failures')} | {s.get('errors')} | {float(s.get('time')):.2f}s |")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            20-final-devops-project/application/backend/reports/
          retention-days: 14

  # ------------------------------------------------------------------ SECURITY: SAST
  sast:
    name: SAST (Semgrep + Bandit)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write          # upload SARIF to the repo's code-scanning tab
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep (community rules + project rules)
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan \
            --config p/python --config p/dockerfile --config "$PROJECT/security/semgrep.yml" \
            --error --metrics=off --sarif --output semgrep.sarif "$PROJECT/application"
      - name: Bandit
        run: |
          pip install bandit==1.9.4
          bandit -c security/bandit.yaml -r application/backend/app -ll
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: hw20-semgrep

  # ------------------------------------------------------------------ SECURITY: SCA
  sca:
    name: SCA (pip-audit, npm audit, Trivy fs)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pip-audit (Python dependencies vs. PyPA advisory DB + OSV)
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r application/backend/requirements.txt --strict --progress-spinner off
      - name: npm audit (production dependencies)
        working-directory: 20-final-devops-project/application/frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Trivy filesystem scan (lockfiles, Dockerfiles, IaC misconfig)
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" fs \
            --config "$PROJECT/security/trivy.yaml" --ignorefile "$PROJECT/security/.trivyignore" \
            --scanners vuln,secret,misconfig --skip-dirs "$PROJECT/outputs" "$PROJECT"

  # ------------------------------------------------------------------ SECURITY: SECRETS
  secret-scan:
    name: Secret scan (gitleaks, full history)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # every commit, not just the tip: a deleted secret is still a leaked secret
      - name: gitleaks
        working-directory: .
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --config "/repo/$PROJECT/security/gitleaks.toml" \
            --log-opts="-- $PROJECT" --redact --verbose --exit-code 1

  # ------------------------------------------------------------------ DOCKER BUILD
  docker-build:
    name: Docker build
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: 20-final-devops-project/application/backend
          tags: ${{ env.BACKEND_IMAGE }}:sha-${{ needs.build-test.outputs.short_sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hw20-backend
          cache-to: type=gha,mode=max,scope=hw20-backend
          outputs: type=docker,dest=${{ runner.temp }}/backend.tar
      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: 20-final-devops-project/application/frontend
          tags: ${{ env.FRONTEND_IMAGE }}:sha-${{ needs.build-test.outputs.short_sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hw20-frontend
          cache-to: type=gha,mode=max,scope=hw20-frontend
          outputs: type=docker,dest=${{ runner.temp }}/frontend.tar
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: |
            ${{ runner.temp }}/backend.tar
            ${{ runner.temp }}/frontend.tar
          retention-days: 3

  # ------------------------------------------------------------------ SECURITY: IMAGES
  image-scan:
    name: Container image scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: images
          path: ${{ runner.temp }}
      - name: Trivy image scan — fail on HIGH/CRITICAL with a fix available
        working-directory: .
        env:
          IMAGES_DIR: ${{ runner.temp }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$IMAGES_DIR:/images" -v "$PWD:/src" -w /src "$TRIVY_IMAGE" image \
            --input "/images/$IMAGE.tar" \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile "$PROJECT/security/.trivyignore" --format table

  # ------------------------------------------------------------------ SECURITY GATE
  security-gate:
    name: Security gate
    needs: [sast, sca, secret-scan, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All security checks must pass
        working-directory: .
        env:
          SAST: ${{ needs.sast.result }}
          SCA: ${{ needs.sca.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          IMAGES: ${{ needs.image-scan.result }}
        run: |
          {
            echo "### Security gate"
            echo "| check | result |"
            echo "|---|---|"
            echo "| SAST (Semgrep + Bandit) | $SAST |"
            echo "| SCA (pip-audit, npm audit, Trivy fs) | $SCA |"
            echo "| Secret scan (gitleaks) | $SECRETS |"
            echo "| Image scan (Trivy) | $IMAGES |"
          } >> "$GITHUB_STEP_SUMMARY"
          for r in "$SAST" "$SCA" "$SECRETS" "$IMAGES"; do
            [ "$r" = success ] || { echo "::error::security gate closed — a check finished with '$r'"; exit 1; }
          done
          echo "gate open: every security check passed"

  # ------------------------------------------------------------------ PUSH
  push:
    name: Push images to GHCR
    needs: [build-test, security-gate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: sha-${{ needs.build-test.outputs.short_sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: images
          path: ${{ runner.temp }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact images that were scanned (sha tag + latest)
        working-directory: .
        env:
          TAG: sha-${{ needs.build-test.outputs.short_sha }}
          IMAGES_DIR: ${{ runner.temp }}
        run: |
          for img in backend frontend; do
            docker load -i "$IMAGES_DIR/$img.tar"
          done
          for repo in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            docker tag "$repo:$TAG" "$repo:latest"
            docker push "$repo:$TAG"
            docker push "$repo:latest"
            echo "pushed \`$repo:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # ------------------------------------------------------------------ DEPLOY
  deploy:
    name: Deploy to Kubernetes (kind + Helm)
    needs: push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: hw20
      - uses: azure/setup-helm@v5
      - name: Pull secret for GHCR (works whether the packages are public or private)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl create namespace incidentdesk
          kubectl -n incidentdesk create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="$GHCR_USER" --docker-password="$GHCR_TOKEN"
      - name: helm upgrade --install (pinned to the pushed tag)
        env:
          TAG: ${{ needs.push.outputs.tag }}
        run: |
          helm upgrade --install incidentdesk helm/incidentdesk -n incidentdesk \
            -f helm/incidentdesk/values-dev.yaml \
            --set backend.image.tag="$TAG" \
            --set frontend.image.tag="$TAG" \
            --set postgres.password="$(openssl rand -hex 16)" \
            --set 'imagePullSecrets[0].name=ghcr' \
            --set ingress.enabled=false \
            --wait --timeout 6m
          helm list -n incidentdesk
          kubectl -n incidentdesk get pods,svc,hpa -o wide
      - name: Smoke test — health, readiness, create + read an incident, frontend proxy
        run: |
          kubectl -n incidentdesk port-forward svc/incidentdesk-frontend 8080:80 >/dev/null 2>&1 &
          for _ in $(seq 1 30); do curl -fs localhost:8080/healthz && break; sleep 2; done
          curl -fs localhost:8080/api/incidents >/dev/null
          kubectl -n incidentdesk port-forward svc/incidentdesk-backend 8000:8000 >/dev/null 2>&1 &
          sleep 3
          curl -fs localhost:8000/health; echo
          curl -fs localhost:8000/ready; echo
          curl -fs -X POST localhost:8000/api/incidents -H 'Content-Type: application/json' \
               -d '{"title":"smoke test from CI","service":"ci","severity":"SEV4"}'; echo
          curl -fs localhost:8000/api/incidents | grep -q "smoke test from CI" && echo "round-trip through PostgreSQL OK"
          curl -fs localhost:8000/metrics | grep -m1 incidents_created_total
      - name: Deployment evidence
        if: always()
        env:
          TAG: ${{ needs.push.outputs.tag }}
        run: |
          {
            echo "### Deployed \`$TAG\` to kind"
            echo '```'
            helm list -n incidentdesk
            kubectl -n incidentdesk get pods,svc -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ GITOPS
  gitops:
    name: GitOps — record the new image tag in Git
    needs: [push, deploy]
    # Loop safety: (1) only on direct pushes to main, (2) never for the bot's own commits,
    # (3) the commit is made with GITHUB_TOKEN, and GitHub does not start workflows for those,
    # (4) "[skip ci]" in the message as a fourth belt.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The environment branch Argo CD watches. It holds only deployable config (a few KB), so
      # Argo can shallow-clone it; main stays the source of truth for code and chart.
      - uses: actions/checkout@v7
        with:
          ref: gitops-config
          path: env
      - name: Publish the chart + the new image tag to the gitops-config branch
        env:
          TAG: ${{ needs.push.outputs.tag }}
        run: |
          rm -rf ../env/incidentdesk
          cp -R helm/incidentdesk ../env/incidentdesk
          gitops/bump-image-tag.sh "$TAG" ../env/incidentdesk/values-dev.yaml
          cd ../env
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A incidentdesk
          git diff --cached --quiet && { echo "already current"; exit 0; }
          git commit -m "gitops: deploy incidentdesk $TAG to dev [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin gitops-config && git push origin HEAD:gitops-config && break
            sleep $((attempt * 5))
          done
          echo "Published \`$TAG\` to gitops-config; Argo CD will sync it to the dev cluster." >> "$GITHUB_STEP_SUMMARY"
