# Homework 16 (Session 17) — CI/CD + DevSecOps.
#
#   Build → Unit Test → SAST → SCA → Secret Scan → Docker Build → Image Scan
#         → Security Gate → Push Image (main only) → Deploy to Kubernetes
#
# Every scanner writes a JSON report and exits 0; the Security Gate job reads all of them,
# applies 16-devsecops/security/gate-policy.json and is the single place that blocks.
# A scanner that crashes fails its own job, which skips the gate: the pipeline fails closed.
name: HW16 DevSecOps

on:
  push:
    paths:
      - "16-devsecops/**"
      - ".github/workflows/hw16-devsecops.yml"
  pull_request:
    branches: [main]
    paths:
      - "16-devsecops/**"
      - ".github/workflows/hw16-devsecops.yml"
  workflow_dispatch:

concurrency:
  group: hw16-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/binarybhakti/hw16-devsecops
  TRIVY_VERSION: 0.75.0
  GITLEAKS_VERSION: 8.30.1
  # mirror.gcr.io first: ghcr.io rate-limits anonymous trivy-db pulls from shared runner IPs
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db

defaults:
  run:
    working-directory: 16-devsecops

jobs:
  # ------------------------------------------------------------------ 1. Build
  build:
    name: 1 · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 16-devsecops/requirements*.txt
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Compile and import the application
        run: |
          python -m compileall -q app
          python -c "from app.app import app; print('routes:', sorted(r.rule for r in app.url_map.iter_rules()))"

  # ------------------------------------------------------------------ 2. Unit test
  unit-test:
    name: 2 · Unit Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 16-devsecops/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v --junitxml=junit.xml --cov=app --cov-report=term-missing --cov-fail-under=85
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: 16-devsecops/junit.xml

  # ------------------------------------------------------------------ 3. SAST
  sast:
    name: 3 · SAST (Semgrep, Bandit, Trivy IaC)
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to the repository's Code scanning tab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          pip install "bandit[sarif]==1.9.4" semgrep==1.179.0
          bash security/install-tools.sh trivy
      - name: Bandit
        run: |
          mkdir -p reports
          bandit -r app -f json -o reports/bandit.json --exit-zero
          bandit -r app -f sarif -o reports/bandit.sarif --exit-zero
      - name: Semgrep (p/python + p/flask + project rules)
        run: |
          semgrep scan --config p/python --config p/flask --config .semgrep.yml --metrics=off \
            --json-output=reports/semgrep.json --sarif-output=reports/semgrep.sarif app
      - name: Trivy IaC scan (Dockerfile + Kubernetes manifests)
        run: |
          trivy config --format json --output reports/trivy-config.json .
          trivy config --format table --severity HIGH,CRITICAL .
      - name: Upload SARIF to Code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true   # code scanning is a view on the results, not the gate
        with:
          sarif_file: 16-devsecops/reports/semgrep.sarif
          category: hw16-semgrep
      - uses: actions/upload-artifact@v7
        with:
          name: sast-reports
          path: 16-devsecops/reports/

  # ------------------------------------------------------------------ 4. SCA
  sca:
    name: 4 · SCA (pip-audit, Trivy fs)
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: |
          pip install pip-audit==2.10.1
          bash security/install-tools.sh trivy
      - name: pip-audit (PyPI advisory DB / OSV)
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -r requirements-dev.txt --format json --output reports/pip-audit.json || true
          pip-audit -r requirements.txt -r requirements-dev.txt || true
      - name: Trivy filesystem scan of the dependency manifests
        run: |
          trivy fs --scanners vuln --format json --output reports/trivy-fs.json .
          trivy fs --scanners vuln --severity HIGH,CRITICAL .
      - uses: actions/upload-artifact@v7
        with:
          name: sca-reports
          path: 16-devsecops/reports/

  # ------------------------------------------------------------------ 5. Secret scan
  secret-scan:
    name: 5 · Secret Scan (gitleaks)
    needs: sca
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: a secret deleted in a later commit is still leaked
      - name: Install gitleaks
        run: bash 16-devsecops/security/install-tools.sh gitleaks
      - name: Scan every commit that touched this homework
        run: |
          mkdir -p reports
          gitleaks git . --config 16-devsecops/.gitleaks.toml --log-opts="--all -- 16-devsecops" \
            --redact --no-banner --report-format json --report-path reports/gitleaks.json --exit-code 0
          python3 -c "import json; f=json.load(open('reports/gitleaks.json')); print(len(f), 'secret(s) found')"
      - uses: actions/upload-artifact@v7
        with:
          name: secret-scan-report
          path: reports/gitleaks.json

  # ------------------------------------------------------------------ 6. Docker build
  docker-build:
    name: 6 · Docker Build
    needs: secret-scan
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: vars
        run: echo "tag=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: 16-devsecops
          tags: ${{ steps.vars.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=hw16
          cache-to: type=gha,mode=max,scope=hw16
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: ${{ runner.temp }}/image.tar
          retention-days: 3

  # ------------------------------------------------------------------ 7. Image scan
  image-scan:
    name: 7 · Container Image Scan (Trivy)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - name: Install Trivy
        run: bash security/install-tools.sh trivy
      - name: Scan the image tarball (the exact bytes that will be pushed)
        working-directory: .
        run: |
          mkdir -p reports
          trivy image --input "${{ runner.temp }}/image.tar" --format json --output reports/trivy-image.json
          trivy image --input "${{ runner.temp }}/image.tar" --severity HIGH,CRITICAL
      - uses: actions/upload-artifact@v7
        with:
          name: image-scan-report
          path: reports/trivy-image.json

  # ------------------------------------------------------------------ 8. Security gate
  security-gate:
    name: 8 · Security Gate
    needs: [sast, sca, secret-scan, image-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-report*"
          path: ${{ runner.temp }}/results
      - name: Apply gate-policy.json to every report
        run: python3 security/gate.py "${{ runner.temp }}/results" --summary "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ 9. Push
  push-image:
    name: 9 · Push Image (GHCR)
    needs: [security-gate, docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: ${{ runner.temp }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image, unchanged
        id: push
        env:
          TAG: ${{ needs.docker-build.outputs.tag }}
        run: |
          docker load -i "${{ runner.temp }}/image.tar"
          docker push "$TAG"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG" | cut -d@ -f2)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "### Pushed \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ 10. Deploy
  deploy:
    name: 10 · Deploy to Kubernetes (kind)
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: hw16
      - name: Namespace (Pod Security "restricted") + registry credentials from this run's token
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n hw16 create secret docker-registry ghcr --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} --docker-password=${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the image by digest
        env:
          REF: ${{ env.IMAGE }}@${{ needs.push-image.outputs.digest }}
        run: |
          sed "s|${IMAGE}:set-by-ci|${REF}|" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl -n hw16 rollout status deployment/hw16-devsecops --timeout=180s
      - name: Smoke test + prove the hardening is live
        run: |
          kubectl -n hw16 get pods -o wide
          kubectl -n hw16 port-forward svc/hw16-devsecops 5001:80 >/dev/null 2>&1 &
          for _ in $(seq 1 20); do curl -fs localhost:5001/health && break; sleep 1; done
          echo; curl -fsI localhost:5001/ | grep -iE '^HTTP|content-security-policy|x-content-type'
          curl -fs localhost:5001/api/status; echo
          POD=$(kubectl -n hw16 get pod -l app=hw16-devsecops -o name | head -1)
          kubectl -n hw16 exec "$POD" -- id
          kubectl -n hw16 exec "$POD" -- sh -c 'touch /app/x 2>&1 || true'
      - name: Deployment evidence in the job summary
        if: always()
        run: |
          {
            echo "### Deployed to kind"; echo '```'
            kubectl -n hw16 get deploy,pods,svc -o wide
            kubectl -n hw16 get deploy hw16-devsecops -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
