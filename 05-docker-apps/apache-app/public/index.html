<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apache Hello World</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;
         min-height:100vh;margin:0;background:#1b1b1f;color:#f5f5f5}
    .card{background:#26262b;padding:3rem 4rem;border-radius:14px;text-align:center;
          border:1px solid #3a3a42}
    h1{margin:0 0 .5rem;font-size:2.5rem;color:#cc2233}
    p{margin:.25rem 0;color:#a5a5b0}
    code{background:#15151a;padding:.15rem .45rem;border-radius:5px;color:#e0785a}
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello World</h1>
    <p>Apache HTTP Server (httpd) running in Docker</p>
    <p>served from <code>/usr/local/apache2/htdocs</code></p>
  </div>
</body>
</html>
