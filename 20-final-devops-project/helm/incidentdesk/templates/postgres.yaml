{{- if .Values.postgres.enabled }}
{{- $name := include "incidentdesk.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-postgres
  labels:
    {{- include "incidentdesk.labels" . | nindent 4 }}
spec:
  clusterIP: None                     # headless: stable DNS for the StatefulSet pod
  selector:
    {{- include "incidentdesk.selector" (dict "ctx" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-postgres
  labels:
    {{- include "incidentdesk.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "incidentdesk.selector" (dict "ctx" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incidentdesk.selector" (dict "ctx" . "component" "postgres") | nindent 8 }}
    spec:
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                   # the postgres user in the alpine image — no root entrypoint step
        runAsGroup: 70
        fsGroup: 70                     # makes the PVC writable for uid 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "incidentdesk.dbSecretName" . }}, key: password } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "incidentdesk.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }     # unix socket + lock file
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: { sizeLimit: 8Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
  volumeClaimTemplates:
    # apiVersion/kind/volumeMode are what the API server defaults anyway; leaving them out made
    # Argo CD report this StatefulSet OutOfSync forever (rendered spec != live spec).
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
