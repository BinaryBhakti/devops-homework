{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "incidentdesk.fullname" . }}-backend
  labels:
    {{- include "incidentdesk.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "incidentdesk.fullname" . }}-backend
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }} }
  behavior:
    scaleUp:
      # >0 ignores short spikes — e.g. Python start-up CPU, which on a starved node read as
      # 550% of request and scaled 1 -> 3 replicas that then starved each other.
      stabilizationWindowSeconds: {{ .Values.hpa.scaleUpStabilizationSeconds | default 0 }}
    scaleDown:
      stabilizationWindowSeconds: 120
{{- end }}
