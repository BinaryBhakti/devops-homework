# grafana-community/grafana — one pod, Prometheus datasource and the IncidentDesk dashboard provisioned
# from code (no clicking in the UI; a fresh install looks identical every time).
#   helm upgrade --install grafana grafana-community/grafana -n monitoring -f grafana-values.yaml
#   (grafana/grafana in the grafana repo is deprecated: the chart moved to grafana-community after 2026-01-30)
# Login: anonymous viewer is enabled for the lab; admin password is in Secret grafana.
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 256Mi }
persistence:
  enabled: false
grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Viewer
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: incidentdesk
        folder: IncidentDesk
        type: file
        options:
          path: /var/lib/grafana/dashboards/incidentdesk
dashboards:
  incidentdesk:
    golden-signals:
      # generated from dashboards/incidentdesk.json — edit that file, not this blob
      json: |
        {"uid": "incidentdesk", "title": "IncidentDesk \u2014 golden signals", "tags": ["incidentdesk", "session21"], "timezone": "browser", "refresh": "10s", "time": {"from": "now-30m", "to": "now"}, "schemaVersion": 41, "panels": [{"id": 1, "title": "Backend pods up", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 0, "w": 4, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(up{namespace=\"incidentdesk\",app_kubernetes_io_component=\"backend\"})", "legendFormat": "up"}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background"}}, {"id": 2, "title": "Request rate", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 4, "y": 0, "w": 4, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(rate(http_requests_total{namespace=\"incidentdesk\"}[2m]))", "legendFormat": "req/s"}], "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}, "options": {}}, {"id": 3, "title": "Error ratio (5xx)", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 8, "y": 0, "w": 4, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "(sum(rate(http_requests_total{namespace=\"incidentdesk\",status=\"5xx\"}[5m])) or vector(0)) / sum(rate(http_requests_total{namespace=\"incidentdesk\"}[5m]))", "legendFormat": ""}], "fieldConfig": {"defaults": {"unit": "percentunit", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.01}, {"color": "red", "value": 0.05}]}}, "overrides": []}, "options": {}}, {"id": 4, "title": "p95 latency", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 0, "w": 4, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"incidentdesk\"}[5m])))", "legendFormat": ""}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "options": {}}, {"id": 5, "title": "Incidents opened (1h)", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 16, "y": 0, "w": 4, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(increase(incidents_created_total{namespace=\"incidentdesk\"}[1h]))", "legendFormat": ""}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {}}, {"id": 6, "title": "Firing alerts", "type": "stat", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 20, "y": 0, "w": 4, "h": 4}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "count(ALERTS{alertstate=\"firing\",alertname=~\"IncidentDesk.*\"}) or vector(0)", "legendFormat": ""}], "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []}, "options": {"colorMode": "background"}}, {"id": 7, "title": "Requests by route and status", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (handler, status) (rate(http_requests_total{namespace=\"incidentdesk\"}[2m]))", "legendFormat": "{{handler}} {{status}}"}], "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []}, "options": {}}, {"id": 8, "title": "Latency p50 / p95 / p99", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"incidentdesk\"}[5m])))", "legendFormat": "p50"}, {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"incidentdesk\"}[5m])))", "legendFormat": "p95"}, {"refId": "C", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"incidentdesk\"}[5m])))", "legendFormat": "p99"}], "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []}, "options": {}}, {"id": 9, "title": "CPU by pod (cores) vs request", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 12, "w": 8, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"incidentdesk\",container!=\"\",container!=\"POD\"}[2m]))", "legendFormat": "{{pod}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {}}, {"id": 10, "title": "Memory working set by pod", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 8, "y": 12, "w": 8, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"incidentdesk\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{pod}}"}], "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []}, "options": {}}, {"id": 11, "title": "Replicas: HPA current / desired", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 16, "y": 12, "w": 8, "h": 8}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"incidentdesk\"}", "legendFormat": "current"}, {"refId": "B", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"incidentdesk\"}", "legendFormat": "desired"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {}}, {"id": 12, "title": "Container restarts (10m)", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 0, "y": 20, "w": 12, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"incidentdesk\"}[10m]))", "legendFormat": "{{pod}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {}}, {"id": 13, "title": "Pods not ready", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"}, "gridPos": {"x": 12, "y": 20, "w": 12, "h": 7}, "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (pod) (kube_pod_status_ready{namespace=\"incidentdesk\",condition=\"false\"})", "legendFormat": "{{pod}}"}], "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []}, "options": {}}]}
