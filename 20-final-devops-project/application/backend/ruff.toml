line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[lint.flake8-bugbear]
# FastAPI's dependency-injection markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[lint.isort]
known-first-party = ["app"]
