<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2;rx:8}
      .grp{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.2;stroke-dasharray:5 4}
      .t{font-weight:700;fill:#0f172a}
      .s{fill:#475569;font-size:11.5px}
      .h{font-weight:700;fill:#334155;font-size:12px;letter-spacing:.06em}
      .ln{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .dl{stroke:#475569;stroke-width:1.2;fill:none;stroke-dasharray:4 3;marker-end:url(#a)}
      .sec{fill:#fff1f2;stroke:#fda4af}
      .ci{fill:#eff6ff;stroke:#93c5fd}
      .k8s{fill:#f0fdf4;stroke:#86efac}
      .obs{fill:#fefce8;stroke:#fde047}
      .tf{fill:#f5f3ff;stroke:#c4b5fd}
    </style>
  </defs>
  <rect width="1280" height="820" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" class="t">IncidentDesk — end-to-end DevOps architecture</text>
  <text x="24" y="54" class="s">Homework 20 (Session 21) · every arrow is something that actually runs in this repository</text>

  <!-- developer & git -->
  <rect class="box" x="24" y="84" width="140" height="56"/>
  <text x="94" y="108" text-anchor="middle" class="t">Developer</text>
  <text x="94" y="126" text-anchor="middle" class="s">git commit / push</text>
  <rect class="box" x="24" y="176" width="140" height="66"/>
  <text x="94" y="200" text-anchor="middle" class="t">GitHub</text>
  <text x="94" y="217" text-anchor="middle" class="s">BinaryBhakti/</text>
  <text x="94" y="231" text-anchor="middle" class="s">devops-homework</text>
  <path class="ln" d="M94 140 V172"/>

  <!-- CI/CD -->
  <rect class="grp" x="196" y="76" width="676" height="186" rx="10"/>
  <text x="210" y="96" class="h">GITHUB ACTIONS · .github/workflows/hw20-final.yml</text>
  <rect class="box ci" x="212" y="112" width="112" height="52"/>
  <text x="268" y="134" text-anchor="middle" class="t">Build &amp; test</text>
  <text x="268" y="151" text-anchor="middle" class="s">pytest+Postgres, vite</text>
  <rect class="box sec" x="346" y="104" width="106" height="30"/><text x="399" y="124" text-anchor="middle" class="s">SAST Semgrep/Bandit</text>
  <rect class="box sec" x="346" y="140" width="106" height="30"/><text x="399" y="160" text-anchor="middle" class="s">SCA pip/npm/Trivy</text>
  <rect class="box sec" x="346" y="176" width="106" height="30"/><text x="399" y="196" text-anchor="middle" class="s">Secrets gitleaks</text>
  <rect class="box ci" x="346" y="212" width="106" height="30"/><text x="399" y="232" text-anchor="middle" class="s">Docker build ×2</text>
  <rect class="box sec" x="474" y="212" width="98" height="30"/><text x="523" y="232" text-anchor="middle" class="s">Trivy image</text>
  <rect class="box sec" x="594" y="140" width="92" height="52"/>
  <text x="640" y="162" text-anchor="middle" class="t">Security</text>
  <text x="640" y="179" text-anchor="middle" class="t">gate</text>
  <rect class="box ci" x="708" y="104" width="148" height="30"/><text x="782" y="124" text-anchor="middle" class="s">Push → GHCR (sha tag)</text>
  <rect class="box ci" x="708" y="140" width="148" height="30"/><text x="782" y="160" text-anchor="middle" class="s">Deploy: kind + Helm, smoke</text>
  <rect class="box ci" x="708" y="176" width="148" height="30"/><text x="782" y="196" text-anchor="middle" class="s">GitOps: bump tag in Git</text>
  <path class="ln" d="M164 205 C185 205 190 138 210 138"/>
  <path class="ln" d="M324 132 H344"/>
  <path class="ln" d="M324 140 C335 140 335 155 344 155"/>
  <path class="ln" d="M324 148 C335 148 335 191 344 191"/>
  <path class="ln" d="M324 156 C335 156 335 227 344 227"/>
  <path class="ln" d="M452 227 H472"/>
  <path class="ln" d="M452 119 C540 119 560 158 592 158"/>
  <path class="ln" d="M452 155 H592"/>
  <path class="ln" d="M452 191 C540 191 560 170 592 170"/>
  <path class="ln" d="M572 227 C590 227 600 196 620 194"/>
  <path class="ln" d="M686 160 C696 160 696 119 706 119"/>
  <path class="ln" d="M782 134 V138"/>
  <path class="ln" d="M782 170 V174"/>
  <path class="dl" d="M708 191 C600 280 300 280 164 232"/>
  <text x="430" y="258" class="s">commit "values-dev.yaml → sha-…" [skip ci]</text>

  <!-- registry -->
  <rect class="box" x="900" y="96" width="172" height="58"/>
  <text x="986" y="120" text-anchor="middle" class="t">GHCR</text>
  <text x="986" y="138" text-anchor="middle" class="s">incidentdesk-backend/frontend</text>
  <path class="ln" d="M856 119 H898"/>

  <!-- minikube -->
  <rect class="grp" x="24" y="296" width="866" height="400" rx="10"/>
  <text x="38" y="316" class="h">MINIKUBE (2 NODES) · local Kubernetes — EKS is LocalStack Pro-only</text>

  <rect class="box tf" x="40" y="332" width="182" height="62"/>
  <text x="131" y="355" text-anchor="middle" class="t">Argo CD</text>
  <text x="131" y="372" text-anchor="middle" class="s">auto-sync · prune · selfHeal</text>
  <text x="131" y="386" text-anchor="middle" class="s">gitops/application-dev.yaml</text>
  <path class="dl" d="M94 242 V330"/>
  <text x="100" y="290" class="s">pulls desired state</text>

  <rect class="grp" x="248" y="332" width="460" height="346" rx="10"/>
  <text x="262" y="352" class="h">NAMESPACE incidentdesk · Helm chart helm/incidentdesk</text>
  <rect class="box k8s" x="264" y="366" width="428" height="40"/>
  <text x="478" y="384" text-anchor="middle" class="t">Ingress (nginx) · incidentdesk.local</text>
  <text x="478" y="399" text-anchor="middle" class="s">/  → frontend:80        /api → backend:8000</text>
  <rect class="box k8s" x="264" y="430" width="196" height="76"/>
  <text x="362" y="452" text-anchor="middle" class="t">frontend Deployment</text>
  <text x="362" y="469" text-anchor="middle" class="s">React build on unprivileged nginx</text>
  <text x="362" y="484" text-anchor="middle" class="s">uid 101 · :8080 · probes /healthz</text>
  <text x="362" y="499" text-anchor="middle" class="s">proxies /api → backend</text>
  <rect class="box k8s" x="482" y="430" width="210" height="96"/>
  <text x="587" y="452" text-anchor="middle" class="t">backend Deployment</text>
  <text x="587" y="469" text-anchor="middle" class="s">FastAPI · uid 10001 · read-only FS</text>
  <text x="587" y="484" text-anchor="middle" class="s">init: wait-for-db → alembic migrate</text>
  <text x="587" y="499" text-anchor="middle" class="s">startup /health · ready /ready (DB)</text>
  <text x="587" y="514" text-anchor="middle" class="s">live /health · /metrics</text>
  <rect class="box k8s" x="482" y="546" width="98" height="40"/>
  <text x="531" y="564" text-anchor="middle" class="t">HPA</text>
  <text x="531" y="579" text-anchor="middle" class="s">1–3 @ 60% CPU</text>
  <rect class="box k8s" x="594" y="546" width="98" height="40"/>
  <text x="643" y="564" text-anchor="middle" class="t">PDB</text>
  <text x="643" y="579" text-anchor="middle" class="s">minAvailable 1</text>
  <rect class="box k8s" x="264" y="546" width="196" height="40"/>
  <text x="362" y="564" text-anchor="middle" class="t">ConfigMap · Secret</text>
  <text x="362" y="579" text-anchor="middle" class="s">checksums roll pods on change</text>
  <rect class="box k8s" x="264" y="606" width="428" height="56"/>
  <text x="478" y="628" text-anchor="middle" class="t">PostgreSQL StatefulSet + headless Service</text>
  <text x="478" y="646" text-anchor="middle" class="s">PVC from volumeClaimTemplates (StorageClass standard, dynamic provisioning)</text>
  <path class="ln" d="M362 406 V428"/>
  <path class="ln" d="M587 406 V428"/>
  <path class="ln" d="M460 468 H480"/>
  <path class="ln" d="M587 526 C587 560 560 590 530 604"/>
  <path class="ln" d="M531 546 V528"/>
  <path class="ln" d="M222 363 H246"/>
  <path class="dl" d="M986 154 C986 420 760 470 694 470"/>
  <text x="800" y="400" class="s">images pulled</text>

  <rect class="grp" x="724" y="512" width="150" height="166" rx="10"/>
  <text x="738" y="532" class="h">NS monitoring</text>
  <rect class="box obs" x="738" y="544" width="122" height="52"/>
  <text x="799" y="566" text-anchor="middle" class="t">Prometheus</text>
  <text x="799" y="583" text-anchor="middle" class="s">+ kube-state-metrics</text>
  <rect class="box obs" x="738" y="612" width="122" height="52"/>
  <text x="799" y="634" text-anchor="middle" class="t">Grafana</text>
  <text x="799" y="651" text-anchor="middle" class="s">dashboard as code</text>
  <path class="dl" d="M736 568 C715 560 712 515 694 505"/>
  <text x="700" y="550" class="s">scrape</text>
  <path class="ln" d="M799 596 V610"/>

  <!-- terraform / localstack -->
  <rect class="grp" x="912" y="296" width="344" height="400" rx="10"/>
  <text x="926" y="316" class="h">TERRAFORM</text>
  <rect class="box tf" x="928" y="330" width="312" height="44"/>
  <text x="1084" y="350" text-anchor="middle" class="t">terraform/ → LocalStack 4.14 (AWS API)</text>
  <text x="1084" y="366" text-anchor="middle" class="s">init · fmt · validate · plan · apply · output · destroy</text>
  <rect class="box" x="928" y="386" width="150" height="124"/>
  <text x="1003" y="406" text-anchor="middle" class="t">VPC 10.20.0.0/16</text>
  <text x="1003" y="424" text-anchor="middle" class="s">2 public + 2 private</text>
  <text x="1003" y="439" text-anchor="middle" class="s">subnets (2 AZs)</text>
  <text x="1003" y="454" text-anchor="middle" class="s">IGW · NAT · route tables</text>
  <text x="1003" y="469" text-anchor="middle" class="s">SG web 80/443</text>
  <text x="1003" y="484" text-anchor="middle" class="s">SG db 5432 ← web SG</text>
  <rect class="box" x="1090" y="386" width="150" height="58"/>
  <text x="1165" y="406" text-anchor="middle" class="t">S3 db-backups</text>
  <text x="1165" y="422" text-anchor="middle" class="s">versioned · SSE · private</text>
  <text x="1165" y="436" text-anchor="middle" class="s">lifecycle IA → expire</text>
  <rect class="box" x="1090" y="452" width="150" height="58"/>
  <text x="1165" y="472" text-anchor="middle" class="t">IAM + DynamoDB</text>
  <text x="1165" y="488" text-anchor="middle" class="s">least-privilege backup role</text>
  <text x="1165" y="502" text-anchor="middle" class="s">state-lock table</text>
  <path class="ln" d="M1084 374 V384"/>
  <rect class="box tf" x="928" y="532" width="312" height="52"/>
  <text x="1084" y="553" text-anchor="middle" class="t">terraform/k8s/ → Kubernetes provider</text>
  <text x="1084" y="570" text-anchor="middle" class="s">namespaces · ResourceQuota · LimitRange</text>
  <path class="ln" d="M928 558 C900 560 900 340 892 340"/>
  <text x="930" y="612" class="s">EKS / ECR / RDS are LocalStack Pro-only, so the</text>
  <text x="930" y="628" class="s">cluster is Minikube; Terraform still owns the cloud</text>
  <text x="930" y="644" class="s">network, storage, IAM — and the cluster bootstrap.</text>

  <!-- legend -->
  <rect class="box ci" x="24" y="716" width="18" height="14"/><text x="48" y="728" class="s">CI/CD</text>
  <rect class="box sec" x="110" y="716" width="18" height="14"/><text x="134" y="728" class="s">security check</text>
  <rect class="box k8s" x="236" y="716" width="18" height="14"/><text x="260" y="728" class="s">Kubernetes object</text>
  <rect class="box obs" x="384" y="716" width="18" height="14"/><text x="408" y="728" class="s">observability</text>
  <rect class="box tf" x="510" y="716" width="18" height="14"/><text x="534" y="728" class="s">IaC / GitOps</text>
  <path class="ln" d="M640 723 H680"/><text x="688" y="728" class="s">runs / calls</text>
  <path class="dl" d="M780 723 H820"/><text x="828" y="728" class="s">pulls / watches</text>
  <text x="24" y="770" class="s">Flow: commit → CI tests, scans and builds → gate → image to GHCR → CI deploys to an ephemeral kind cluster and smoke-tests →</text>
  <text x="24" y="788" class="s">CI commits the new tag to values-dev.yaml → Argo CD syncs Minikube → Prometheus scrapes /metrics → Grafana shows the golden signals.</text>
</svg>
