apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentdesk-backend
  namespace: incidentdesk
spec:
  # no "replicas:" — the HPA in 07-hpa.yaml owns the replica count
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/component: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: incidentdesk, app.kubernetes.io/component: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: wait-for-db          # don't let "DB not up yet" look like a crash loop
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -q; do sleep 2; done"]
          envFrom: [{ configMapRef: { name: incidentdesk-config } }]
          securityContext: { runAsUser: 70, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
        - name: migrate              # Alembic owns the schema; an advisory lock serialises replicas
          image: ghcr.io/binarybhakti/incidentdesk-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ configMapRef: { name: incidentdesk-config } }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: incidentdesk-db, key: password } }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      containers:
        - name: backend
          image: ghcr.io/binarybhakti/incidentdesk-backend:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: incidentdesk-config } }]
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: incidentdesk-db, key: password } }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"
          # startup: up to 60 s to boot; liveness only judges after that
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          # readiness: /ready checks the database -> pod leaves the Service when the DB is gone
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # liveness: /health does NOT check the DB -> a DB outage never causes a restart storm
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 16Mi } }]
---
apiVersion: v1
kind: Service
metadata:
  name: incidentdesk-backend
  namespace: incidentdesk
spec:
  selector: { app.kubernetes.io/component: backend }
  ports: [{ name: http, port: 8000, targetPort: http }]
