# Needs metrics-server, and CPU *requests* on the target (04-backend.yaml sets 100m) —
# utilisation is measured against the request.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: incidentdesk-backend
  namespace: incidentdesk
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: incidentdesk-backend }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 120 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: incidentdesk-backend
  namespace: incidentdesk
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/component: backend }
