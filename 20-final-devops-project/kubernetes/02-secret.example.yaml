# EXAMPLE ONLY — this file is a template and is not applied as-is.
#
# Real secrets are never committed. Create the Secret out-of-band instead:
#
#   kubectl -n incidentdesk create secret generic incidentdesk-db \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# In a GitOps setup the encrypted form goes into Git instead (Sealed Secrets / SOPS), or the
# value is pulled from a vault by the External Secrets Operator. See ../security/README.md.
apiVersion: v1
kind: Secret
metadata:
  name: incidentdesk-db
  namespace: incidentdesk
type: Opaque
stringData:
  password: REPLACE_ME   # placeholder — 99-apply.sh never applies this file; it generates the Secret
