backend:
  replicas: 1
  probes:
    startup:
      path: /health
      periodSeconds: 3
      failureThreshold: 60
    readiness:
      path: /readyz
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
    liveness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi
  image:
    tag: sha-212269d
frontend:
  replicas: 1
  image:
    tag: sha-212269d
config:
  APP_ENV: dev
  LOG_LEVEL: debug
postgres:
  password: local-dev-only
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  scaleUpStabilizationSeconds: 180
pdb:
  enabled: false
ingress:
  host: incidentdesk.local
