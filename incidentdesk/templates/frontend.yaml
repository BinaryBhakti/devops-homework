{{- $name := include "incidentdesk.fullname" . }}
{{- $f := .Values.frontend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-frontend
  labels:
    {{- include "incidentdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ $f.replicas }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "incidentdesk.selector" (dict "ctx" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incidentdesk.selector" (dict "ctx" . "component" "frontend") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: "{{ $f.image.repository }}:{{ $f.image.tag }}"
          imagePullPolicy: {{ $f.image.pullPolicy }}
          env:
            - name: BACKEND_URL
              # FQDN: nginx's runtime resolver does not apply the pod's DNS search domains
              value: "http://{{ $name }}-backend.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.port }}"
          ports:
            - { name: http, containerPort: {{ $f.port }} }
          # Startup first: liveness and readiness only begin once nginx answers. Without it, on a
          # CPU-starved node the entrypoint scripts took longer than liveness allowed (3 x 10 s,
          # 1 s timeout) and the kubelet killed nginx before it ever listened: CrashLoopBackOff.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60        # up to 2 minutes to start
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6       # a minute of failures before a restart: nginx is not "stuck" after one slow answer
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          securityContext:
            {{- include "incidentdesk.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }                     # nginx pid + temp files
            - { name: conf, mountPath: /etc/nginx/conf.d }       # envsubst renders default.conf here
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: conf, emptyDir: { sizeLimit: 1Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-frontend
  labels:
    {{- include "incidentdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "incidentdesk.selector" (dict "ctx" . "component" "frontend") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
