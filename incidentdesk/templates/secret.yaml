{{- if not .Values.postgres.existingSecret }}
{{- $pw := required "set postgres.password (dev) or postgres.existingSecret (anything real)" .Values.postgres.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "incidentdesk.fullname" . }}-db
  labels:
    {{- include "incidentdesk.labels" . | nindent 4 }}
type: Opaque
stringData:          # stringData: Kubernetes does the base64 — no hand-encoding, no trailing-newline bugs
  password: {{ $pw | quote }}
{{- end }}
