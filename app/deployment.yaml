apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
  namespace: session20
  labels: { app: gitops-demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gitops-demo }
  template:
    metadata:
      labels: { app: gitops-demo }
      annotations:
        page-version: "v1"          # bumped with the page so a content change rolls the pods
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: page, mountPath: /usr/share/nginx/html }
      volumes:
        - name: page
          configMap: { name: gitops-demo-page }
