# Load generator: each replica is one busybox loop hammering the Service as fast as it can.
# It is a Deployment (not a bare Pod) so the load can be raised in steps with `kubectl scale`.
#
# The CPU limit and the nodeSelector are lessons from the first attempt: four UNLIMITED wget
# loops each ate a full core on the control-plane node and starved kube-apiserver until it
# stopped answering. A load generator is a noisy neighbour; give it a ceiling and keep it off
# the node running the control plane.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 1
  selector:
    matchLabels: { app: load-generator }
  template:
    metadata:
      labels: { app: load-generator }
    spec:
      nodeSelector:
        kubernetes.io/hostname: minikube-m02
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O /dev/null http://hpa-demo-service; done"]
          resources:
            requests: { cpu: 50m, memory: 8Mi }
            limits: { cpu: 150m, memory: 32Mi }
