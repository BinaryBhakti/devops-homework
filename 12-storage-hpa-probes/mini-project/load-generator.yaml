# The course's load-generator pod, as a capped 3-worker Deployment kept off the control-plane
# node (see Homework 12 Task 2 for why an unlimited generator is dangerous on a small cluster).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: production-webapp
spec:
  replicas: 3
  selector: { matchLabels: { app: load-generator } }
  template:
    metadata: { labels: { app: load-generator } }
    spec:
      nodeSelector: { kubernetes.io/hostname: minikube-m02 }
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://web-service >/dev/null; done"]
          resources:
            requests: { cpu: 50m, memory: 8Mi }
            limits: { cpu: 150m, memory: 32Mi }
