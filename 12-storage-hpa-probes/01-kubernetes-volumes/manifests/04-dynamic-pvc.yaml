# Dynamic provisioning: no PV is written by anyone. The claim names a StorageClass, and that
# class's provisioner (k8s.io/minikube-hostpath here; ebs.csi.aws.com on EKS) creates the PV.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests: { storage: 500Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: dynamic-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - { name: data, mountPath: /data }
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: dynamic-pvc }
