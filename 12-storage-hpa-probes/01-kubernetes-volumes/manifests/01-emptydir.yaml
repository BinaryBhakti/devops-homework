# emptyDir: scratch space created when the Pod is scheduled, shared by every container in the
# Pod, and deleted with the Pod. Here a "writer" sidecar produces a page that nginx serves.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date '+written by the writer container at %T' > /shared/index.html; sleep 5; done"]
      volumeMounts:
        - { name: shared, mountPath: /shared }
    - name: web
      image: nginx:1.27-alpine
      volumeMounts:
        - { name: shared, mountPath: /usr/share/nginx/html }
  volumes:
    - name: shared
      emptyDir:
        sizeLimit: 50Mi
