# Static provisioning: an admin creates the PersistentVolume by hand ...
apiVersion: v1
kind: PersistentVolume
metadata:
  name: student-pv
  labels: { tier: manual }
spec:
  capacity: { storage: 1Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual          # not "standard", so the dynamic provisioner stays out of it
  hostPath:
    path: /tmp/student-data
---
# ... and a user claims it. The claim asks for 500Mi; it binds to the 1Gi PV (closest fit).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-pvc
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: manual
  selector:
    matchLabels: { tier: manual }
  resources:
    requests: { storage: 500Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
spec:
  nodeName: minikube          # hostPath-backed PV: keep it on the node that has the directory
  containers:
    - name: app
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - { name: persistent-storage, mountPath: /data }
  volumes:
    - name: persistent-storage
      persistentVolumeClaim: { claimName: student-pvc }
