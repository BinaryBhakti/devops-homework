apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: 2
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders, tier: backend }
    spec:
      containers:
        - name: orders
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=orders service OK"]
          ports: [{ name: http, containerPort: 5678 }]
