# Fix: provide the configuration the app requires, from a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: crashloop-config
data:
  DATABASE_URL: postgresql://yatri_admin@postgres:5432/yatri_production_db
---
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-pod
  labels: { tier: triage }
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      envFrom:
        - configMapRef: { name: crashloop-config }
      command:
        - python3
        - -c
        - |
          import os, sys, time
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print(f"Application started successfully! db={db_url}", flush=True)
          time.sleep(3600)
