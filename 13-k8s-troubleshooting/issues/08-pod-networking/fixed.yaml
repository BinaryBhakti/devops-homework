# Fix: bind to all interfaces (0.0.0.0) so the pod IP — and therefore the Service — reaches it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
spec:
  replicas: 1
  selector: { matchLabels: { app: inventory } }
  template:
    metadata: { labels: { app: inventory } }
    spec:
      containers:
        - name: inventory
          image: python:3.12-alpine
          command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: inventory }
spec:
  selector: { app: inventory }
  ports: [{ port: 80, targetPort: 8080 }]
