# A small, healthy app to practise the read-only troubleshooting commands on:
# a 2-replica Deployment, a Service, and a chatty logger pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: v1
kind: Pod
metadata:
  name: logs-demo
  labels: { app: logs-demo }
spec:
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "Application started"
          echo "Connecting to database..."
          echo "Database connection successful"
          i=0
          while true; do i=$((i+1)); echo "heartbeat $i: application is healthy"; [ $((i % 4)) -eq 0 ] && echo "WARN slow query took 1200ms" >&2; sleep 3; done
